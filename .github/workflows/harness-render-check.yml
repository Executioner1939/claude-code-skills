name: harness-sdk render --check

on:
  push:
    branches: [ main ]
    paths:
      - "plugins/harness-sdk/**"
      - "plugins/**/*.harness"
      - "plugins/**/bodies/**"
      - "plugins/**/values.yaml"
  pull_request:
    paths:
      - "plugins/harness-sdk/**"
      - "plugins/**/*.harness"
      - "plugins/**/bodies/**"
      - "plugins/**/values.yaml"

jobs:
  render-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml jinja2 jsonschema

      - name: render --check
        run: |
          PYTHONPATH=plugins/harness-sdk/src \
            python -m harness_sdk render --check

      - name: lint
        run: |
          PYTHONPATH=plugins/harness-sdk/src \
            python -m harness_sdk lint

      - name: fmt --check
        run: |
          PYTHONPATH=plugins/harness-sdk/src \
            python -m harness_sdk fmt --check
