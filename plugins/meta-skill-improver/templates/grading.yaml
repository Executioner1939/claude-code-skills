# meta-skill-improver -- per-skill grading config.
#
# Copy this to evals/<skill>/grading.yaml when starting a new skill under
# improvement. Override only the knobs you actually want to differ from
# defaults; missing keys fall back to library defaults.
#
# Spec: plugins/meta-skill-improver/skills/grading/SKILL.md

# How much each per-run component contributes to the composite score.
# Must sum to 1.0. Defaults below; weights are validated at load.
component_weights:
  correctness: 0.40        # fraction of post-conditions that pass (deterministic)
  root_cause: 0.30         # LLM-judge: did the fix address the root cause?
  no_regression: 0.15      # fraction of untouched files still match baseline
  skill_attribution: 0.05  # was the skill actually loaded for the run?
  efficiency: 0.10         # 1 - (turns_used / turns_budget)

# Per-class prompt weights. Must sum to 1.0.
prompt_weights:
  vague_real: 0.40         # the realistic case -- weight it most
  explicit_flawed: 0.30    # user's explicit instructions, missing a step
  synthetic_correct: 0.15  # negative control, well-specified prompt
  adversarial: 0.15        # tries to lure the agent into the wrong fix

# Trials per (snapshot, prompt, condition) cell. Higher = lower variance,
# higher cost. The CLI flags --quick (3) and --full (10) override this.
runs_per_cell: 5

# Minimum lift on the [0, 1] scale that we treat as a "real" improvement.
# Lift below this is in the noise floor and does not promote.
min_meaningful_lift: 0.05

# Benjamini-Hochberg false discovery rate. Used to decide whether a per-cell
# regression is real or chance.
fdr_q: 0.05

# Cohen's kappa floor for the LLM-judge calibration. Below this, the judge is
# considered unreliable and promotion is blocked.
kappa_min: 0.6

# Per-cell turn budget. Used by the runner and the efficiency component.
turns_budget: 40

# Bootstrap iterations for confidence intervals. 1000 is fast and stable.
bootstrap_iters: 1000
